<!DOCTYPE html>
<html>

<head>

    <title>
        Attendance
    </title>

    <style>

        .student-container{

            display:flex;
            flex-wrap:wrap;
            gap:20px;

            margin-top:20px;
        }

        .student-circle{

            width:80px;
            height:80px;

            border-radius:50%;

            background:red;
            color:white;

            display:flex;
            justify-content:center;
            align-items:center;

            cursor:pointer;

            font-size:20px;
        }

        .present{

            background:green;
        }

    </style>

</head>

<body>

    <h1>
        Mark Attendance
    </h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.course }}

        <button type="submit">
            Load Students
        </button>

        <div class="student-container">

            {% for student in students %}

                <div
                    class="student-circle"

                    onclick="toggleAttendance(this)"
                >

                    {{ student.id }}

                    <input
                        type="checkbox"

                        name="students"

                        value="{{ student.id }}"

                        hidden
                    >

                </div>

            {% endfor %}

        </div>

        <br>

        {% if students %}

            <button type="submit">

                Mark Attendance

            </button>

        {% endif %}

    </form>

    <script>

        function toggleAttendance(el){

            el.classList.toggle("present");

            let checkbox = el.querySelector("input");

            checkbox.checked = !checkbox.checked;
        }

    </script>

</body>

</html>
